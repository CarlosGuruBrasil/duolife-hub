[phases.setup]
nixPkgs = ["nodejs_22", "curl", "wget"]
aptPkgs = []

[variables]
NODE_OPTIONS = "--max-old-space-size=1536"
NEXT_TELEMETRY_DISABLED = "1"
NODE_ENV = "production"

[phases.install]
cmds = ["NPM_CONFIG_PRODUCTION=false npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
