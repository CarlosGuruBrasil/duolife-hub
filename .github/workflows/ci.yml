name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Run automated tests (Vitest)
        run: npm test

      - name: Verify Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/duolife_ci"
          JWT_SECRET: "ci-secret-for-build-purposes-only-32chars"
          NEXT_PUBLIC_APP_URL: "https://duolife.guru.dev.br"
